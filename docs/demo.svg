<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <radialGradient id="d-bg" cx="60%" cy="35%" r="90%">
      <stop offset="0%" stop-color="#0b1338"/><stop offset="60%" stop-color="#060a1e"/><stop offset="100%" stop-color="#03040c"/>
    </radialGradient>
    <filter id="d-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="d-acc" x1="0" x2="1"><stop offset="0" stop-color="#7cf6ff"/><stop offset="1" stop-color="#b58bff"/></linearGradient>
  </defs>
  <rect width="900" height="460" fill="url(#d-bg)"/>

  <!-- scattered clusters (each a colored group) -->
  <g filter="url(#d-glow)">
    <!-- NLP / target cluster (top-right) -->
    <g fill="#7cf6ff">
      <circle cx="620" cy="120" r="7"><animate attributeName="r" values="6;9;6" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="665" cy="95" r="5"/><circle cx="585" cy="150" r="5"/><circle cx="690" cy="145" r="4.5"/><circle cx="640" cy="170" r="4"/>
    </g>
    <!-- vision cluster -->
    <g fill="#ff8bd8"><circle cx="740" cy="300" r="5"/><circle cx="775" cy="330" r="4"/><circle cx="710" cy="335" r="4.5"/></g>
    <!-- systems cluster -->
    <g fill="#ffd166"><circle cx="230" cy="330" r="5"/><circle cx="270" cy="360" r="4"/><circle cx="195" cy="360" r="4.5"/><circle cx="255" cy="300" r="4"/></g>
    <!-- biology cluster -->
    <g fill="#7bffa6"><circle cx="150" cy="150" r="5"/><circle cx="115" cy="185" r="4"/><circle cx="190" cy="180" r="4.5"/></g>
    <!-- finance -->
    <g fill="#ffe08a"><circle cx="420" cy="390" r="4.5"/><circle cx="460" cy="410" r="4"/></g>
  </g>

  <!-- query origin -->
  <g transform="translate(120,410)">
    <circle r="6" fill="url(#d-acc)" filter="url(#d-glow)"/>
    <text x="14" y="5" font-size="13" fill="#cdd6ff">query: “how do machines understand language?”</text>
  </g>

  <!-- beams sweep to the NLP cluster -->
  <g stroke-linecap="round">
    <line x1="120" y1="410" x2="620" y2="120" stroke="#9fefff" stroke-width="2">
      <animate attributeName="opacity" values="0;0.95;0.5;0.95" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="0 600;600 0" dur="1.4s" repeatCount="indefinite"/>
    </line>
    <line x1="120" y1="410" x2="665" y2="95" stroke="#c8b6ff" stroke-width="1.4" opacity="0">
      <animate attributeName="opacity" values="0;0.8;0.4" dur="4s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="120" y1="410" x2="585" y2="150" stroke="#c8b6ff" stroke-width="1.2" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0.35" dur="4s" begin="0.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- results panel fading in -->
  <g transform="translate(30,30)">
    <rect width="330" height="196" rx="14" fill="#0a1030" stroke="#2b3a7a" opacity="0.92"/>
    <text x="18" y="34" font-size="15" font-weight="700" fill="url(#d-acc)">Nearest concepts</text>
    <g font-size="12.5" fill="#dfe4ff">
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.6s" fill="freeze"/>
        <text x="18" y="66" font-size="17" font-weight="800" fill="#7cf6ff">94%</text>
        <text x="70" y="66">self-attention weighs every token’s relevance</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.9s" fill="freeze"/>
        <text x="18" y="98" font-size="17" font-weight="800" fill="#7cf6ff">91%</text>
        <text x="70" y="98">large language models predict the next token</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.2s" fill="freeze"/>
        <text x="18" y="130" font-size="17" font-weight="800" fill="#7cf6ff">88%</text>
        <text x="70" y="130">word embeddings map meaning to geometry</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.5s" fill="freeze"/>
        <text x="18" y="162" font-size="17" font-weight="800" fill="#7cf6ff">85%</text>
        <text x="70" y="162">the transformer replaces recurrence entirely</text></g>
    </g>
    <text x="18" y="186" font-size="10.5" fill="#8b96c9">ranked by cosine similarity · computed on-device</text>
  </g>

  <text x="880" y="445" text-anchor="end" font-size="11" fill="#5f6aa0">MiniLM embeddings → PCA → k-means → Three.js · 100% in-browser</text>
</svg>
