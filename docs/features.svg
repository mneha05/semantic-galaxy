<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <filter id="f-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .tile{fill:#0b1026;stroke:rgba(140,160,255,.16)}
    .h{font-size:13px;font-weight:700}
    .s{font-size:10.5px;fill:#8b96c9}
  </style>

  <!-- tile 1: meaning not words -->
  <g transform="translate(20,20)">
    <rect class="tile" width="228" height="160" rx="14"/>
    <text x="20" y="44" font-size="26" filter="url(#f-glow)">🧠</text>
    <text x="20" y="82" class="h" fill="#7cf6ff">Reads meaning</text>
    <text x="20" y="104" class="s">not keywords — synonyms</text>
    <text x="20" y="120" class="s">and paraphrases just work</text>
    <g><circle cx="30" cy="140" r="4" fill="#7cf6ff"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <line x1="34" y1="140" x2="150" y2="140" stroke="#233"/><circle cx="150" cy="140" r="4" fill="#ff8bd8"/></g>
  </g>

  <!-- tile 2: self-organizing -->
  <g transform="translate(268,20)">
    <rect class="tile" width="228" height="160" rx="14"/>
    <text x="20" y="44" font-size="26" filter="url(#f-glow)">🌌</text>
    <text x="20" y="82" class="h" fill="#b58bff">Self-organizing map</text>
    <text x="20" y="104" class="s">clusters emerge from the</text>
    <text x="20" y="120" class="s">model — nobody drew them</text>
    <g fill="#b58bff" filter="url(#f-glow)"><circle cx="150" cy="138" r="3"/><circle cx="165" cy="130" r="3"/><circle cx="178" cy="142" r="3"/><circle cx="160" cy="148" r="2.5">
      <animate attributeName="r" values="2;4;2" dur="1.6s" repeatCount="indefinite"/></circle></g>
  </g>

  <!-- tile 3: on-device -->
  <g transform="translate(516,20)">
    <rect class="tile" width="228" height="160" rx="14"/>
    <text x="20" y="44" font-size="26" filter="url(#f-glow)">⚡</text>
    <text x="20" y="82" class="h" fill="#ffd479">Runs on your device</text>
    <text x="20" y="104" class="s">a real transformer, offline,</text>
    <text x="20" y="120" class="s">no server · no API key</text>
    <rect x="20" y="132" width="120" height="6" rx="3" fill="#1a2140"/>
    <rect x="20" y="132" width="40" height="6" rx="3" fill="#ffd479"><animate attributeName="width" values="0;120;120" dur="2.4s" repeatCount="indefinite"/></rect>
  </g>

  <!-- tile 4: from scratch -->
  <g transform="translate(764,20)">
    <rect class="tile" width="216" height="160" rx="14"/>
    <text x="20" y="44" font-size="26" filter="url(#f-glow)">🎛️</text>
    <text x="20" y="82" class="h" fill="#ff8bd8">Math from scratch</text>
    <text x="20" y="104" class="s">PCA + k-means by hand,</text>
    <text x="20" y="120" class="s">no NumPy, no sklearn</text>
    <text x="20" y="146" font-size="10" fill="#6b74a8" font-family="monospace">Σ xxᵀ → eig → project</text>
  </g>
</svg>
