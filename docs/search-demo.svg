<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <radialGradient id="d-bg" cx="62%" cy="34%" r="92%"><stop offset="0" stop-color="#0d1740"/><stop offset="60%" stop-color="#060a1e"/><stop offset="100%" stop-color="#03040c"/></radialGradient>
    <radialGradient id="d-neb" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#b58bff" stop-opacity=".3"/><stop offset="1" stop-color="#b58bff" stop-opacity="0"/></radialGradient>
    <filter id="d-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="d-acc" x1="0" x2="1"><stop offset="0" stop-color="#7cf6ff"/><stop offset="1" stop-color="#ff8bd8"/></linearGradient>
  </defs>
  <rect width="900" height="470" fill="url(#d-bg)"/>
  <ellipse cx="640" cy="140" rx="230" ry="150" fill="url(#d-neb)"/>

  <g filter="url(#d-glow)">
    <g fill="#7cf6ff"><circle cx="620" cy="120" r="7"><animate attributeName="r" values="6;9;6" dur="2.5s" repeatCount="indefinite"/></circle>
      <circle cx="665" cy="95" r="5"/><circle cx="585" cy="150" r="5"/><circle cx="690" cy="145" r="4.5"/><circle cx="640" cy="170" r="4"/></g>
    <g fill="#ff8bd8"><circle cx="740" cy="300" r="5"/><circle cx="775" cy="330" r="4"/><circle cx="710" cy="335" r="4.5"/></g>
    <g fill="#ffd479"><circle cx="230" cy="330" r="5"/><circle cx="270" cy="360" r="4"/><circle cx="195" cy="360" r="4.5"/><circle cx="255" cy="300" r="4"/></g>
    <g fill="#7bffa6"><circle cx="150" cy="150" r="5"/><circle cx="115" cy="185" r="4"/><circle cx="190" cy="180" r="4.5"/></g>
    <g fill="#b58bff"><circle cx="420" cy="395" r="4.5"/><circle cx="460" cy="415" r="4"/></g>
  </g>

  <g transform="translate(120,415)"><circle r="6" fill="url(#d-acc)" filter="url(#d-glow)"/>
    <text x="14" y="5" font-size="13" fill="#cdd6ff">query: “how do machines understand language?”</text></g>

  <g stroke-linecap="round">
    <line x1="120" y1="415" x2="620" y2="120" stroke="#9fefff" stroke-width="2">
      <animate attributeName="opacity" values="0;.95;.5;.95" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="0 620;620 0" dur="1.4s" repeatCount="indefinite"/></line>
    <line x1="120" y1="415" x2="665" y2="95" stroke="#d7b6ff" stroke-width="1.4" opacity="0"><animate attributeName="opacity" values="0;.8;.4" dur="4s" begin=".3s" repeatCount="indefinite"/></line>
    <line x1="120" y1="415" x2="585" y2="150" stroke="#ffc9ec" stroke-width="1.2" opacity="0"><animate attributeName="opacity" values="0;.7;.35" dur="4s" begin=".5s" repeatCount="indefinite"/></line>
  </g>

  <g transform="translate(30,30)">
    <rect width="340" height="200" rx="14" fill="#0a1030" stroke="#3a4680" opacity=".95"/>
    <text x="18" y="34" font-size="15" font-weight="700" fill="url(#d-acc)">Nearest concepts</text>
    <g font-size="12.5" fill="#dfe4ff">
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin=".6s" fill="freeze"/><text x="18" y="68" font-size="17" font-weight="800" fill="#7cf6ff">94%</text><text x="72" y="68">self-attention weighs every token</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin=".9s" fill="freeze"/><text x="18" y="100" font-size="17" font-weight="800" fill="#7cf6ff">91%</text><text x="72" y="100">LLMs predict the next token</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="1.2s" fill="freeze"/><text x="18" y="132" font-size="17" font-weight="800" fill="#b58bff">88%</text><text x="72" y="132">word embeddings map meaning to geometry</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur=".5s" begin="1.5s" fill="freeze"/><text x="18" y="164" font-size="17" font-weight="800" fill="#ff8bd8">85%</text><text x="72" y="164">the transformer replaces recurrence</text></g>
    </g>
    <text x="18" y="190" font-size="10.5" fill="#7c86bb">ranked by cosine similarity · computed on-device</text>
  </g>

  <text x="880" y="452" text-anchor="end" font-size="11" fill="#5f6aa0">MiniLM embeddings → PCA → k-means → Three.js · 100% in-browser</text>
</svg>
