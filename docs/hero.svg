<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#0d1740"/>
      <stop offset="55%" stop-color="#070b22"/>
      <stop offset="100%" stop-color="#03040c"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7cf6ff"/>
      <stop offset="100%" stop-color="#b58bff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- twinkling starfield -->
  <g fill="#9fb4ff">
    <circle cx="120" cy="70" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="250" r="1.2" fill="#7cf6ff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="90" r="1.8" fill="#b58bff"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="270" r="1.3"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="200" r="1.1" fill="#7cf6ff"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1140" cy="180" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="40" r="1.2" fill="#b58bff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- cluster of stars on the right, with a scanning query beam -->
  <g transform="translate(880,170)">
    <g fill="#7cf6ff" filter="url(#glow)">
      <circle cx="0" cy="0" r="6"><animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="-25" r="4" fill="#b58bff"/>
      <circle cx="-30" cy="30" r="4" fill="#7bffa6"/>
      <circle cx="55" cy="35" r="3.5" fill="#ffd166"/>
      <circle cx="-45" cy="-20" r="3.5" fill="#ff8bd8"/>
      <circle cx="20" cy="55" r="3" fill="#5b9dff"/>
    </g>
    <!-- animated beam from query origin to the cluster -->
    <line x1="-360" y1="10" x2="0" y2="0" stroke="#9fefff" stroke-width="1.6" opacity="0">
      <animate attributeName="opacity" values="0;0.9;0" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="-360" y1="10" x2="40" y2="-25" stroke="#c8b6ff" stroke-width="1.2" opacity="0">
      <animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="0.25s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- rotating logo -->
  <g transform="translate(90,170)">
    <text font-size="64" fill="url(#title)" filter="url(#glow)" text-anchor="middle" dy="22">◐
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- title + tagline -->
  <text x="150" y="150" font-size="58" font-weight="800" fill="url(#title)" filter="url(#glow)">Semantic Galaxy</text>
  <text x="152" y="196" font-size="22" fill="#cdd6ff" font-weight="500">Search a universe of ideas by <tspan fill="#7cf6ff" font-weight="700">meaning</tspan>, not keywords.</text>
  <text x="152" y="232" font-size="16" fill="#8b96c9">A real transformer runs in your browser — no server, no API key, no limits.</text>

  <!-- query bar mockup -->
  <g transform="translate(152,262)">
    <rect width="470" height="42" rx="12" fill="#0a1030" stroke="#2b3a7a"/>
    <text x="16" y="27" font-size="15" fill="#e8ecff">how do machines understand language?</text>
    <text x="16" y="27" font-size="15" fill="#e8ecff">
      <animate attributeName="opacity" values="1;0.15;1" dur="1s" repeatCount="indefinite"/>
      <tspan>|</tspan>
    </text>
    <rect x="392" y="7" width="70" height="28" rx="8" fill="#7cf6ff"/>
    <text x="427" y="26" font-size="13" font-weight="700" fill="#04121a" text-anchor="middle">Search</text>
  </g>
</svg>
