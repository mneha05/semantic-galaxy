<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="28%" r="95%">
      <stop offset="0%" stop-color="#0e1948"/><stop offset="52%" stop-color="#070b22"/><stop offset="100%" stop-color="#03040c"/>
    </radialGradient>
    <radialGradient id="neb1" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#b58bff" stop-opacity=".35"/><stop offset="100%" stop-color="#b58bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ff8bd8" stop-opacity=".28"/><stop offset="100%" stop-color="#ff8bd8" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#7cf6ff"/><stop offset="0.55" stop-color="#b58bff"/><stop offset="1" stop-color="#ff8bd8"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <!-- nebula clouds -->
  <ellipse cx="960" cy="120" rx="260" ry="180" fill="url(#neb1)"/>
  <ellipse cx="820" cy="300" rx="240" ry="150" fill="url(#neb2)"/>

  <!-- twinkling starfield -->
  <g fill="#cdd9ff">
    <circle cx="120" cy="60" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="260" r="1.2" fill="#7cf6ff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="70" r="1.8" fill="#ffd479"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="1010" cy="300" r="1.3"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="220" r="1.1" fill="#ff8bd8"><animate attributeName="opacity" values="0.2;.9;.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="200" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="40" r="1.2" fill="#b58bff"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="70" r="1" fill="#7cf6ff"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- galaxy cluster + scanning query beams -->
  <g transform="translate(910,180)">
    <g fill="#7cf6ff" filter="url(#glow)">
      <circle cx="0" cy="0" r="6"><animate attributeName="r" values="5;7.5;5" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="44" cy="-28" r="4.2" fill="#b58bff"/><circle cx="-34" cy="32" r="4.2" fill="#ff8bd8"/>
      <circle cx="60" cy="38" r="3.6" fill="#ffd479"/><circle cx="-50" cy="-22" r="3.6" fill="#7bffa6"/>
      <circle cx="22" cy="60" r="3.2" fill="#5b9dff"/><circle cx="-64" cy="6" r="3" fill="#b58bff"/>
    </g>
    <line x1="-380" y1="12" x2="0" y2="0" stroke="#9fefff" stroke-width="1.7" opacity="0"><animate attributeName="opacity" values="0;.95;0" dur="3s" repeatCount="indefinite"/></line>
    <line x1="-380" y1="12" x2="44" y2="-28" stroke="#d7b6ff" stroke-width="1.2" opacity="0"><animate attributeName="opacity" values="0;.7;0" dur="3s" begin=".25s" repeatCount="indefinite"/></line>
    <line x1="-380" y1="12" x2="-34" y2="32" stroke="#ffc9ec" stroke-width="1.1" opacity="0"><animate attributeName="opacity" values="0;.6;0" dur="3s" begin=".45s" repeatCount="indefinite"/></line>
  </g>

  <!-- rotating logo -->
  <g transform="translate(92,172)"><text font-size="66" fill="url(#title)" filter="url(#glow)" text-anchor="middle" dy="23">◐
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/></text></g>

  <!-- title -->
  <text x="152" y="150" font-size="60" font-weight="800" fill="url(#title)" filter="url(#glow)">Semantic Galaxy</text>
  <text x="154" y="198" font-size="22" fill="#cdd6ff" font-weight="500">Search a universe of ideas by <tspan fill="#7cf6ff" font-weight="700">meaning</tspan>, not keywords.</text>
  <text x="154" y="234" font-size="15" fill="#93a0c7">A real transformer runs in your browser — no server, no API key, no limits.</text>

  <!-- query bar -->
  <g transform="translate(154,262)">
    <rect width="480" height="44" rx="12" fill="#0a1030" stroke="#3a4680"/>
    <text x="16" y="28" font-size="15" fill="#e8ecff">how do machines understand language?<tspan fill="#7cf6ff"><animate attributeName="opacity" values="1;.1;1" dur="1s" repeatCount="indefinite"/>|</tspan></text>
    <rect x="398" y="8" width="72" height="28" rx="8" fill="url(#title)"/>
    <text x="434" y="27" font-size="13" font-weight="700" fill="#04121a" text-anchor="middle">Search</text>
  </g>
</svg>
